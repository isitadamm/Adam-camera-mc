name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        working-directory: adam-camera/adam-camera
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: adam-camera
          path: adam-camera/adam-camera/build/libs/*.jar
